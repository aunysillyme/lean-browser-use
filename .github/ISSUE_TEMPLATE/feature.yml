name: Feature request
description: Propose a concrete improvement with a visible success check.
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Job to be done
      description: What task is hard today, and which part of the package is involved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest change that makes the task work.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Observable success check
      description: Give a command, fixture, or visible result that would prove success.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current approach
      description: Describe any workaround and relevant constraints.
