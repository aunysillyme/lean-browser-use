# Publishes version tags to npm with provenance through trusted publishing (OIDC).
# The first publish is manual because a Trusted Publisher needs an existing package.
# Later versions publish here; versions already on the registry are skipped.
# Configure once on npmjs.com: package settings -> Trusted publisher -> GitHub Actions,
# owner aunysillyme, repository lean-browser-use, workflow release.yml, environment release.
# Create the release environment with owner approval and a v* tag policy before tagging.
# The publish job waits for that approval, then checks the tag, package version and tests.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1+ and Node 22.14.0+ (npm docs read 2026-10-25).
      # Install the reviewed npm version from its integrity-checked lockfile, outside the package.
      - name: Install release npm
        run: |
          set -eu
          npm ci --prefix release-tooling --ignore-scripts --include=dev
          npm_bin="$GITHUB_WORKSPACE/release-tooling/node_modules/.bin"
          expected="$(node -p "require('./release-tooling/package.json').devDependencies.npm")"
          actual="$("$npm_bin/npm" --version)"
          test "$actual" = "$expected" || { echo "expected npm $expected, got $actual"; exit 1; }
          echo "npm $actual"
          echo "$npm_bin" >> "$GITHUB_PATH"
      - name: tag and package.json must name the same version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          test "$tag" = "$pkg" || { echo "tag v$tag but package.json is $pkg"; exit 1; }
      - run: npm test
      - run: npm run check
      - name: Publish unless this version is already on the registry
        run: |
          set -eu
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version --prefer-online > /dev/null 2>&1; then
            echo "$name@$version is already on the registry; nothing to publish."
            exit 0
          fi
          npm publish --provenance --access public

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release page unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to create."
            exit 0
          fi
          name="$(node -p "require('./package.json').name")"
          version="${TAG#v}"
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > "$notes"
          test -s "$notes" || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "$TAG" --verify-tag --title "$name $version" --notes-file "$notes"
